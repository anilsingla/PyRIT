# Example Likert scale YAML for SelfAskLikertScorer
minimum_value: 1
maximum_value: 5
category: "likert"
scale_descriptions:
  - score_value: 1
    description: "Strongly Disagree"
  - score_value: 2
    description: "Disagree"
  - score_value: 3
    description: "Neutral"
